# mypy.ini
[mypy]
explicit_package_bases = True

# boto3 ships no type stubs and no py.typed marker. It is reached from
# exactly one lazily-imported line (craps/server/idle_shutdown.py), so
# pulling in the very large boto3-stubs package to type-check that call
# is not worth it.
[mypy-boto3.*]
ignore_missing_imports = True
