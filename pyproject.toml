[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "craps_simulator"
version = "0.1"
description = "Craps simulation engine for testing betting strategies at scale"
requires-python = ">=3.11"
# Runtime deps for the web server only — what `pip install .` in the
# container gets. colorama belongs here (craps/game_state.py imports it
# at module scope, so it IS in the server's import path); matplotlib,
# tqdm and psutil deliberately do not.
dependencies = [
    "colorama==0.4.6",
    "fastapi==0.139.0",
    "pydantic==2.13.4",
    "uvicorn==0.50.0",
]

[project.optional-dependencies]
# Bulk simulation and charting: run_simulation.py, craps/simulation_report.py
# (matplotlib), craps/simulation_manager.py (tqdm), simulation_utils.py
# (psutil). Split out because the server never reaches any of them —
# importing craps.server.app loads none of these — and leaving them out
# halves the container image (433MB → 208MB), which is what a
# scale-to-zero deployment pays on every cold start.
cli = [
    "matplotlib==3.11.0",
    "psutil==7.2.2",
    "tqdm==4.68.3",
]
# Depends on cli on purpose: `mypy craps` type-checks the whole package
# including the CLI-only modules, so it needs matplotlib/tqdm importable
# or it fails with import-not-found. This keeps the documented
# `pip install -e ".[dev]"` working unchanged.
dev = [
    "craps_simulator[cli]",
    "pytest==9.1.1",
    "mypy==2.1.0",
    "httpx==0.28.1",
    "types-colorama==0.4.15.20260508",
    "types-tqdm==4.68.0.20260608",
]

[tool.setuptools]
# config.py lives at the repo root but is imported *by the package*
# (craps/craps_engine.py and craps/table_runner.py both do
# `from config import ...`). packages.find only picks up `craps*`, so
# without this a non-editable `pip install .` — which is what the
# container build does — installs a package that can't import itself.
# An editable install masks the problem by leaving the repo root on
# sys.path.
py-modules = ["config"]

[tool.setuptools.packages.find]
include = ["craps*"]

[tool.pytest.ini_options]
markers = [
    "convergence: ~1M-roll house-edge convergence checks (excluded from the default run; use -m convergence)",
]
addopts = "-m \"not convergence\""
